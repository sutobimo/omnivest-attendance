<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">

  <title>OmniVest Attendance</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 24px 20px 30px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .omnivest-logo {
      width: 180px;
      height: auto;
      display: block;
      margin: 0 auto 16px;
    }

    .logo h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .logo p {
      margin: 5px 0 0;
      color: #777;
      font-size: 13px;
    }

    .card {
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .value {
      font-size: 18px;
      font-weight: 600;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #bbb;
      flex-shrink: 0;
    }

    .status-dot.valid {
      background: #20a464;
    }

    .status-dot.invalid {
      background: #d64545;
    }

    .photo-area {
      margin-top: 20px;
      text-align: center;
    }

    #preview {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 16px;
      display: none;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-btn {
      background: #111;
      color: white;
    }

    .attendance-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .attendance-btn {
      background: #111;
      color: white;
    }

    .attendance-btn:disabled {
      background: #ddd;
      color: #999;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #16834d;
    }

    .error {
      color: #c0392b;
    }

    .loading {
      color: #777;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #aaa;
      font-size: 11px;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">
    <img src="icon-512.png" class="omnivest-logo" alt="OmniVest">
    <h1>OmniVest Attendance</h1>
    <p>Staff Attendance System</p>
  </div>

  <div class="card">

    <div class="label">Employee</div>
    <div class="value" id="employeeName">Loading...</div>

    <div style="height:18px;"></div>

    <div class="label">Position</div>
    <div class="value" id="employeePosition">—</div>

    <div style="height:18px;"></div>

    <div class="label">Location</div>

    <div class="location">
      <span class="status-dot" id="locationDot"></span>
      <div class="value" id="locationStatus">
        Detecting location...
      </div>
    </div>

  </div>


  <div class="card">

    <div class="label">Identity Verification</div>

    <div class="photo-area">

      <img id="preview">

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        capture="user"
      >

      <button
        class="photo-btn"
        id="photoButton"
        onclick="takePhoto()"
      >
        TAKE PHOTO
      </button>

    </div>

  </div>


  <div class="card">

    <div class="label">Attendance</div>

    <div class="attendance-buttons">

      <button
        class="attendance-btn"
        id="checkInBtn"
        disabled
        onclick="submitAttendance('IN')"
      >
        CHECK IN
      </button>

      <button
        class="attendance-btn"
        id="checkOutBtn"
        disabled
        onclick="submitAttendance('OUT')"
      >
        CHECK OUT
      </button>

    </div>

  </div>


  <div class="message" id="message"></div>


  <div class="footer">
    OmniVest · Attendance System
  </div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyI_DEoM6JDDgQrsZTuZduJ_cQSqvLRIClME27EWXjUwN9Wn3GHLr8YrxKKr2PC3yIA/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const employeeKey =
  params.get("key") ||
  "test001";


let employee = null;

let latitude = null;

let longitude = null;

let photoBase64 = null;


const employeeName =
  document.getElementById(
    "employeeName"
  );


const employeePosition =
  document.getElementById(
    "employeePosition"
  );


const locationStatus =
  document.getElementById(
    "locationStatus"
  );


const locationDot =
  document.getElementById(
    "locationDot"
  );


const preview =
  document.getElementById(
    "preview"
  );


const photoInput =
  document.getElementById(
    "photoInput"
  );


const checkInBtn =
  document.getElementById(
    "checkInBtn"
  );


const checkOutBtn =
  document.getElementById(
    "checkOutBtn"
  );


const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type = ""
) {

  message.textContent =
    text;

  message.className =
    "message " + type;
}


/* =====================================================
   LOAD EMPLOYEE
===================================================== */

function loadEmployee() {

  showMessage(
    "Loading employee...",
    "loading"
  );


  const callbackName =
    "employeeCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      delete window[callbackName];


      if (
        !result ||
        !result.success
      ) {

        employeeName.textContent =
          "Employee not found";

        employeePosition.textContent =
          "—";

        showMessage(
          result &&
          result.message
            ? result.message
            : "Unable to load employee.",
          "error"
        );

        return;
      }


      employee =
        result;


      employeeName.textContent =
        result.name;


      employeePosition.textContent =
        result.position;


      showMessage(
        "Employee verified.",
        "success"
      );

      getLocation();
    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?action=getEmployee" +
    "&key=" +
    encodeURIComponent(
      employeeKey
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      showMessage(
        "Unable to connect to attendance server.",
        "error"
      );
    };


  document.body.appendChild(
    script
  );
}


/* =====================================================
   CAMERA
===================================================== */

function takePhoto() {

  photoInput.click();
}


photoInput.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];


    if (!file) return;


    const reader =
      new FileReader();


    reader.onload =
      function() {

        photoBase64 =
          reader.result;


        preview.src =
          photoBase64;


        preview.style.display =
          "block";


        checkButtons();


        showMessage(
          "Photo ready. You can continue.",
          "success"
        );
      };


    reader.readAsDataURL(
      file
    );
  }
);


/* =====================================================
   GPS
===================================================== */

function getLocation() {

  if (!navigator.geolocation) {

    locationStatus.textContent =
      "GPS not supported";

    locationDot.classList.add(
      "invalid"
    );

    return;
  }


  locationStatus.textContent =
    "Detecting location...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;


      longitude =
        position.coords.longitude;


      locationStatus.textContent =
        "Location detected";


      locationDot.classList.remove(
        "invalid"
      );


      locationDot.classList.add(
        "valid"
      );


      checkButtons();
    },


    function(error) {

      locationStatus.textContent =
        "Please allow GPS";


      locationDot.classList.remove(
        "valid"
      );


      locationDot.classList.add(
        "invalid"
      );


      showMessage(
        "Location permission is required.",
        "error"
      );
    },


    {
      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0
    }
  );
}


/* =====================================================
   BUTTON STATE
===================================================== */

function checkButtons() {

  const ready =
    latitude !== null &&
    longitude !== null &&
    photoBase64 !== null &&
    employee !== null;


  checkInBtn.disabled =
    !ready;


  checkOutBtn.disabled =
    !ready;
}


/* =====================================================
   SUBMIT ATTENDANCE
===================================================== */

function submitAttendance(
  requestedType
) {

  if (
    !employee ||
    !photoBase64 ||
    latitude === null ||
    longitude === null
  ) {

    showMessage(
      "Please complete employee, photo and GPS first.",
      "error"
    );

    return;
  }


  checkInBtn.disabled =
    true;


  checkOutBtn.disabled =
    true;


  showMessage(
    "Submitting attendance...",
    "loading"
  );


  const requestId =
    "REQ-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 8);


  /*
   * IMPORTANT:
   * We use a normal HTML form POST
   * to avoid browser CORS restrictions.
   */


  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    "attendance_submit_frame";


  form.style.display =
    "none";


  const fields = {

    action:
      "saveAttendance",

    employeeId:
      employee.employeeId,

    latitude:
      latitude,

    longitude:
      longitude,

    photoBase64:
      photoBase64,

    faceStatus:
      "PENDING",

    faceScore:
      "",

    device:
      navigator.userAgent,

    requestId:
      requestId,

    requestedType:
      requestedType
  };


  Object.keys(fields)
    .forEach(function(key) {

      const input =
        document.createElement(
          "input"
        );


      input.type =
        "hidden";


      input.name =
        key;


      input.value =
        fields[key];


      form.appendChild(
        input
      );
    });


  document.body.appendChild(
    form
  );


  form.submit();


  /*
   * Poll Apps Script until
   * the attendance row appears.
   */

  pollAttendanceStatus(
    requestId,
    0
  );
}


/* =====================================================
   POLL RESULT
===================================================== */

function pollAttendanceStatus(
  requestId,
  attempt
) {

  if (attempt >= 20) {

    showMessage(
      "Attendance submitted. Please check your attendance sheet.",
      "success"
    );

    checkButtons();

    return;
  }


  const callbackName =
    "statusCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      delete window[callbackName];


      if (
        result &&
        result.success &&
        !result.pending
      ) {

        if (
          result.approvalStatus ===
          "AUTO APPROVED"
        ) {

          showMessage(

            result.attendanceType +
            " successful. Attendance approved.",

            "success"
          );

        } else if (
          result.approvalStatus ===
          "PENDING"
        ) {

          showMessage(

            result.attendanceType +
            " recorded. Waiting for admin approval.",

            "loading"
          );

        } else {

          showMessage(

            "Attendance rejected.",

            "error"
          );
        }


        checkButtons();

        return;
      }


      setTimeout(
        function() {

          pollAttendanceStatus(
            requestId,
            attempt + 1
          );

        },
        1000
      );
    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?action=getStatus" +
    "&requestId=" +
    encodeURIComponent(
      requestId
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];


      setTimeout(
        function() {

          pollAttendanceStatus(
            requestId,
            attempt + 1
          );

        },
        1000
      );
    };


  document.body.appendChild(
    script
  );
}


/* =====================================================
   START
===================================================== */

loadEmployee();

</script>

</body>
</html>
